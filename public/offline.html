<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Tumbuh Kembang</title>
    <link rel="icon" href="/icons/icon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #0a0a0a; --muted: #6b7280; --accent: #0d9488; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #9ca3af; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px 16px; background: var(--bg); color: var(--fg); text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
      }
      main { max-width: 22rem; display: grid; gap: 12px; justify-items: center; }
      img { width: 56px; height: 56px; border-radius: 12px; }
      h1 { font-size: 1.25rem; margin: 4px 0 0; }
      p { margin: 0; color: var(--muted); font-size: 0.9rem; }
      button {
        margin-top: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px;
        background: var(--accent); color: #fff; font: inherit; font-weight: 500; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>Anda sedang offline</h1>
      <p>
        Data pertumbuhan anak hanya ditampilkan saat terhubung ke internet, demi menjaga
        kerahasiaannya. Sambungkan kembali perangkat Anda lalu coba lagi.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
